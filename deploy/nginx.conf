# إعداد Nginx المرجعي — يقوم install.sh بإنشاء نسخة مطابقة تلقائياً.
# عدّل APP_DIR و PHP_SOCK و server_name حسب سيرفرك.

server {
    listen 80;
    listen [::]:80;
    server_name example.com;              # اسم النطاق أو IP الخاص بك

    root /var/www/exif-image-analyzer/public;
    index index.php;

    client_max_body_size 30m;             # يجب أن يطابق أو يتجاوز post_max_size
    client_body_timeout 120s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;   # تحقق من إصدار PHP لديك
        fastcgi_read_timeout 150s;
    }

    # حماية ملفات المصدر والإعدادات
    location ~* /(config|src|storage|deploy)/ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
