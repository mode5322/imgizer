# Reference Nginx config — install.sh generates an identical copy automatically.
# Adjust APP_DIR, PHP_SOCK and server_name for your server.

server {
    listen 80;
    listen [::]:80;
    server_name example.com;              # Your domain or IP

    root /var/www/exif-image-analyzer/public;
    index index.php;

    client_max_body_size 30m;             # Must match or exceed post_max_size
    client_body_timeout 120s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;   # Check your PHP version
        fastcgi_read_timeout 150s;
    }

    # Protect source and config files
    location ~* /(config|src|storage|deploy)/ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}